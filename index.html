<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xoş Gəldin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #141428 0%, #07070f 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
    }

    /* Arxa fon neon halqaları */
    .glow-bg {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.18), transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      animation: pulseGlow 4s infinite alternate;
      transition: background 0.8s ease;
      z-index: 0;
    }

    body.prank-active .glow-bg {
      background: radial-gradient(circle, rgba(255, 0, 60, 0.28), transparent 70%);
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 20px;
      max-width: 90%;
    }

    /* İlk yazı: Xoş gəldin */
    #welcome-text {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #e0f7ff;
      text-shadow:
        0 0 10px #00f0ff,
        0 0 25px #00f0ff,
        0 0 50px #0077ff;
      opacity: 0;
      transform: scale(0.7) translateY(20px);
      animation: welcomeIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    #welcome-text.fade-out {
      animation: welcomeOut 0.6s ease forwards;
    }

    /* İkinci yazı: 5 saniyə sonra gələn mesaj */
    #prank-text {
      display: none;
      font-size: clamp(2.2rem, 7vw, 4.8rem);
      font-weight: 900;
      line-height: 1.25;
      color: #fff;
      text-shadow:
        0 0 12px #ff003c,
        0 0 30px #ff003c,
        0 0 60px #ff5500;
      opacity: 0;
    }

    #prank-text.show {
      display: block;
      animation: slamIn 0.7s cubic-bezier(0.17, 0.89, 0.32, 1.28) forwards;
    }

    /* Ekran titrəmə effekti */
    .shake {
      animation: screenShake 0.5s ease-in-out;
    }

    /* Kiçik səs bildirişi (brauzer autoplay bloklayarsa görünür) */
    #sound-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.35);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.9rem;
      color: #bdefff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    #sound-hint.visible {
      opacity: 1;
    }

    @keyframes welcomeIn {
      0% {
        opacity: 0;
        transform: scale(0.7) translateY(25px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes welcomeOut {
      0% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.25);
        filter: blur(12px);
      }
    }

    @keyframes slamIn {
      0% {
        opacity: 0;
        transform: scale(2.2);
        filter: blur(15px);
      }
      70% {
        opacity: 1;
        transform: scale(0.95);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-10px, 6px) rotate(-1deg); }
      40% { transform: translate(10px, -6px) rotate(1deg); }
      60% { transform: translate(-8px, -4px) rotate(-0.5deg); }
      80% { transform: translate(8px, 4px) rotate(0.5deg); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.2); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <div class="container">
    <h1 id="welcome-text">Xoş gəldin</h1>
    <h1 id="prank-text">Xalid adamın başına bele sıcirlar</h1>
  </div>

  <div id="sound-hint">🔊 Səsi aktivləşdirmək üçün ekrana toxun</div>

  <!-- Arxa fon səsi -->
  <audio id="bg-audio" src="xalid.m4a" preload="auto" loop></audio>

  <script>
    const audio = document.getElementById('bg-audio');
    const welcomeText = document.getElementById('welcome-text');
    const prankText = document.getElementById('prank-text');
    const soundHint = document.getElementById('sound-hint');
    let audioStarted = false;

    // Səsi işə salma funksiyası
    function playAudio() {
      if (audioStarted) return;
      audio.play()
        .then(() => {
          audioStarted = true;
          soundHint.classList.remove('visible');
        })
        .catch(() => {
          // Brauzer avtomatik səsi bloklasa bildiriş göstər
          soundHint.classList.add('visible');
        });
    }

    // Səhifə yüklənəndə səsi başlatmağa cəhd et
    window.addEventListener('DOMContentLoaded', () => {
      playAudio();

      // 5 saniyə sonra yazını dəyiş
      setTimeout(() => {
        welcomeText.classList.add('fade-out');

        setTimeout(() => {
          welcomeText.style.display = 'none';
          document.body.classList.add('prank-active', 'shake');
          prankText.classList.add('show');
        }, 550);
      }, 5000);
    });

    // İstifadəçi ekrana toxunarsa və ya klikləyərsə səsi dərhal başlat
    ['click', 'touchstart', 'keydown'].forEach(evt => {
      document.addEventListener(evt, playAudio, { once: false });
    });
  </script>
</body>
</html>
